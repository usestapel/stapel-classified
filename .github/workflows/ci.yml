name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install unpublished member libs from git
        # Members not on PyPI yet — installed from git first so that
        # `pip install -e .` finds their requirement already satisfied.
        run: |
          pip install git+https://github.com/usestapel/stapel-core.git
          pip install git+https://github.com/usestapel/stapel-reviews.git
          pip install git+https://github.com/usestapel/stapel-shop.git

      - name: Install
        run: pip install -e ".[all]" || pip install -e .

      - name: Lint
        run: |
          pip install ruff --quiet
          ruff check . --select E,F,W --ignore E501

      - name: migration-lint (expand/contract gate, release-management.md §3)
        run: |
          pip install "stapel-tools>=0.9.1,<1" --quiet
          stapel-migration-lint . --strict

      - name: Import check
        run: python -c "import stapel_classified; print('import OK')"

      - name: Install test dependencies
        run: pip install pytest pytest-django pytest-cov "stapel-tools>=0.9.1,<1"

      - name: Tests with coverage
        run: |
          pytest tests/ \
            --cov=stapel_classified \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          files: coverage.xml
          flags: stapel-classified
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
