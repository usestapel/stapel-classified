[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-classified"
version = "0.10.7"
description = "Composite: classified ads — the shop composite + geo + search + moderation + vocabularies"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "classified", "composite", "geo", "search", "moderation", "vocabularies"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# A composite introduces NO versions of its own — it pins the same ranges the
# STAPEL_LIBS registry / each member lib already uses, fixing the combination.
#
# stapel-categories is pinned DIRECTLY, above the floor stapel-shop asks for:
# the search source's category rollup is answered by `categories.path`, which
# arrived in 0.5.6. Depending on it only transitively would let a resolver
# pick 0.5.5 and leave every parent-category filter finding nothing. The
# range itself moved to 0.7 in this release — see the block further down.
#
# THAT KNOWN HOLD IS CLOSED. 0.5.0 shipped saying so in as many words: shop
# 0.2.6 capped `stapel-categories<0.6`, `stapel-attributes<0.5` and
# `stapel-listings<0.10`, so `pip install stapel-classified==0.5.0` was
# ResolutionImpossible until stapel-shop shipped a cap bump, and lowering the
# ranges here to satisfy stale caps would have pinned every deployment to a
# fleet where rules, form metadata and ref-typed features do not exist. shop
# 0.2.7 answered the attributes-v2 half and 0.2.8 the categories-0.8 half, so
# the floor below moves to 0.2.8 — the same rule, one member down: a resolver
# left free to pick 0.2.6 picks a shop whose own cap contradicts this file.
#
# stapel-moderation's floor is raised to 0.3 by the same target: a chat
# message is the first target here whose content is PRIVATE, and 0.3.0 is the
# release where `can_view_content` is asked on behalf of the moderator
# actually looking (it passed actor_id=None before) and where the card's
# `content` is a declared field of the contract rather than a graft onto the
# response dict.
#
# stapel-chat's floor is 0.6 as of 0.3.2, and the pin is now load-bearing in a
# way it was not: this composite READS chat. `chat.conversation_participants`
# (0.6.0) is where a conversation's parties and its subject come from since
# `ConversationSubject` was deleted, and `chat.moderation_content` (0.5.0)
# serves a reported message. On chat 0.5 every conversation header answers 503
# — a resolver error is a much better place to learn that than an empty inbox.
# The composite still imports nothing from chat and mounts none of it; the pin
# fixes WHICH chat a deployment that has one must be on.
#
# stapel-listings is pinned DIRECTLY too, for the same shape of reason:
# `search_sources.listing_source()` imports `stapel_listings.models.
# INDEXED_STATUSES` by name to build `visible_statuses`, so this composite
# reads listings' re-moderation-keeps-it-visible behaviour (0.5.0) straight
# off that set. Leaving the pin transitive would let a resolver settle on
# whatever floor stapel-shop asks for and silently regress the seam this
# composite is the one place that can prove.
#
# stapel-core's floor is 0.45 as of 0.3.2 — not because anything here needs a
# 0.45 API, but because stapel-chat 0.6.0 does, and fixing a COMBINATION that
# actually installs is the whole job of a composite's pin block. A resolver
# left to reconcile core>=0.43 with chat>=0.6 finds the answer eventually; a
# reader of this file should not have to.
#
# stapel-reviews is pinned DIRECTLY as of 0.3.2, at the range stapel-shop
# already asks for: `preset.INSTALLED_APPS` mounts it and the header's seller
# rating reads `reviews.aggregate`, so a module this composite MOUNTS was
# reaching it only transitively. The sibling-declaration gate
# (tests/test_test_dependencies.py) is what noticed.
#
# stapel-attributes becomes a DIRECT pin in 0.5.0. It is an L1 library and
# NOT a Django app (it is deliberately absent from preset.INSTALLED_APPS),
# and until now it arrived transitively through listings and shop. It cannot
# any more: this composite now installs stapel-vocabularies, whose whole job
# is to IMPLEMENT attributes' `VocabularyResolver` protocol, and that
# protocol (`stapel_attributes.vocabularies`) together with the `ref_select`
# / `ref_hierarchical_select` types is 0.5. Left transitive, a resolver could
# settle on 0.4.x and the deployment would boot with
# `stapel_vocabularies.W001` — the terms API answering normally while every
# ref-typed feature refuses to save. >=0.5.1, not >=0.5.0: 0.5.1 is the
# release whose recorded rule corpus is what the two evaluators (Python and
# attributes-react) are held to.
#
# stapel-categories >=0.8.1 (was >=0.7 in 0.5.0): 0.7 is where the six new
# `FeatureDef` keys (`rules`, `description`, `example`, `default`, `hints`,
# `group`) are stored, served by `categories.features` and declared in
# `$defs.ResolvedFeature` — on 0.6 a category can hold no rule and no
# ref-typed feature, so the vocabularies this composite mounts would have
# nothing pointing at them. The floor moved past it twice more in 0.5.1: 0.8.0
# keys a catalog re-import on `(external_source, external_id)` instead of the
# slug, and 0.8.1 makes a full-catalog import complete at all. See the
# dependency line for both.
#
# stapel-listings >=0.10: the release where requiredness on publish is the
# RULE STATE rather than `mandatory` (a conditionally required field blocks
# publication, a rule-hidden answer is dropped instead of stored) and where
# `features_title` / `features_badges` carry the `ref_select` DAO whole — the
# `labels` half that `search_sources._title_text` reads for display. On 0.9
# the mapper's ref-typed title chips would fall back to term codes.
#
# stapel-search >=0.3.1: `get_facet_mapping('ref_select') == 'term'` /
# `'ref_hierarchical_select') == 'path'`, and `closed_options` is not built
# for any config carrying an `optionsRef` — a vocabulary is open-ended for
# the facet planner, so zero-filling it would invent counts for 14 962 phone
# models nobody asked about.
#
# stapel-vocabularies >=0.1,<0.2 — the new member. Its floor is its first
# release; the cap is the house pre-1.0 rule (minor = breaking).
dependencies = [
    "stapel-core>=0.45,<1.0",
    # <0.7 with the floor at 0.6: stapel-attributes 0.6.0 adds the composite
    # `group` kind — one feature holding a list of ROWS of child feature
    # definitions. It is not a nicety for an imported marketplace catalogue:
    # 2 468 fields of the imported catalogue corpus ARE composites (a
    # wholesale discount ladder, a compatible-vehicles table), and until 0.6
    # the importer
    # counted them and dropped them. The floor moves with the cap for the
    # usual reason — a fleet able to resolve back onto 0.5 is a fleet whose
    # catalogue silently loses those fields again — and because the two
    # members below now require it themselves.
    # >=0.7,<0.8 as of 0.6.0, and the floor moves with the cap for the reason
    # this block has now given four times. 0.7.0 makes an inline `select`'s
    # stored DAO carry the option LABELS beside the values, the way `ref_select`
    # has carried them since 0.5. It is a write-time snapshot, so a deployment
    # able to resolve back onto 0.6 publishes listings whose display copy is
    # gone at the moment of writing, where no reader can repair it — which is
    # exactly the screen this release was cut for: «Состояние: b-u», «Датчики:
    # gps», «Состояние экрана: bez-defektov» on live cards, and an index whose
    # only match for the word a buyer types was the description text.
    # >=0.8,<0.9 as of 0.8.0, and the floor moves with the cap for the reason
    # this block has now given five times. 0.8.0 adds `FeatureDef.visibility`
    # — the axis that says an attribute IDENTIFIES a specific physical unit
    # (a VIN, an IMEI, a serial number) rather than describing it, and must
    # therefore never reach an anonymous reader. Under the old range this
    # composite resolves onto a version with no axis at all: the catalogue has
    # no way to mark the field, every consumer publishes it, and the fix is
    # invisible because nothing errors. The three members below all require
    # 0.8 themselves.
    # <0.10 as of stapel-classified 0.9.4: stapel-attributes 0.9.0 changes one
    # rule semantic — `in` / `not_in` no longer match a controller that reads
    # EMPTY. This module composes categories + listings rather than evaluating
    # rules itself; the cap moves so the fleet can install one attributes
    # version, and the suite is green on 0.9.0 unchanged.
    "stapel-attributes>=0.8.1,<0.10",
    # >=0.4, not >=0.2: 0.4.0 is where ALLOW_ANONYMOUS_WRITES exists at all.
    # A fleet that declares it under the old range gets an inert setting, so
    # the floor moves with the cap rather than leaving a deployment able to
    # resolve back onto a version where the guest wall is a comment.
    # >=0.5, not >=0.4: 0.5.0 is where stapel_reviews subscribes 'user.merged'
    # and re-parents an author's reviews to the surviving account. Under the
    # old range a resolver picks 0.4.x, and a host that mounts it fails
    # stapel_core.lifecycle.E001 at `manage.py check` — which is exactly what
    # 0.5.1..0.5.3 of THIS package died of, three publish runs in a row: the
    # composite mounts reviews, so the composite is where the silence is
    # reported. The cap moves with the floor by the house pre-1.0 rule.
    # <0.7, not <0.6: stapel-reviews 0.6.0 adds an optional denormalised
    # `owner_key` column on reviews, a new per-owner batch aggregate
    # Function/endpoint, and a backfill command for the column. This module
    # calls only the existing single-key `reviews.aggregate` Function
    # (`cards.py:_rating`, one call per seller `user_id`) for the
    # `{avg, count}` a seller card publishes — it never reaches the new
    # batch Function or the `owner_key` column. The cap was the only wall.
    "stapel-reviews>=0.5,<0.7",
    # >=0.2.8, not >=0.2.6: 0.2.8 is the release whose own
    # `stapel-categories` cap admits 0.8. Held at 0.2.6 a resolver can pick a
    # shop that caps `stapel-categories<0.8` and the line below has no
    # solution — the same ResolutionImpossible this composite has now walked
    # into three times, one member down.
    # >=0.2.9: 0.2.9 is where shop's own attributes cap becomes <0.7. Held at
    # 0.2.8 (cap <0.6) the attributes line above has no solution — the same
    # ResolutionImpossible this composite has now walked into four times.
    # >=0.2.10: 0.2.10 is where shop's own reviews cap becomes <0.6. Held at
    # 0.2.9 (cap <0.5) the reviews line above has no solution — the same
    # ResolutionImpossible this composite has now walked into five times.
    # >=0.2.12: 0.2.11 widened shop's attributes cap to <0.8 and that alone was
    # inert — shop still capped `stapel-listings<0.11`, so the listings line
    # below had no solution and pip resolved attributes back to 0.6.2 rather
    # than failing. The sixth instance of this exact shape in this block.
    # >=0.2.14: the release that widens shop's own `stapel-categories<0.9`.
    # Without it the two lines have no common solution and pip resolves
    # categories back under this composite's floor.
    # >=0.2.18: the release that widens shop's own `stapel-categories<0.12`
    # and `stapel-listings<0.13`. Without moving this floor the two lines
    # below are inert — pip resolves a shop that caps the members back down,
    # and the widening above does nothing, silently. This composite has
    # recorded that exact shape four times.
    # >=0.2.20: the release whose own caps admit categories 0.14 and
    # listings 0.14 — the floor moves with the caps above for the recorded
    # reason: without it pip resolves a shop that caps the members back down
    # and the widening above does nothing, silently.
    # >=0.2.24: the floor moves with the listings cap above, and it has to.
    # shop capped stapel-listings<0.16 of its own, so a fleet resolving this
    # composite against an older shop cannot install the listings this
    # composite now requires — the cap in a SIBLING is the wall, which is the
    # shape this file has hit four times and names each time.
    # >=0.2.25: shop's own stapel-categories cap moves with this one, the
    # sibling-cap wall this file has now named seven times.
    "stapel-shop>=0.2.25,<0.3",
    # >=0.8.1,<0.9, and the floor moves with the cap for the usual reason.
    # 0.8.0 stops keying a catalog re-import on the SLUG: an imported
    # category's slug comes from the source catalogue's node path, so a
    # source-side rename moved the slug while the node id stayed, and the
    # re-import soft-deleted the row holding the listings and created a
    # duplicate beside it. Matching is `(external_source, external_id)` first
    # now. 0.8.1 is what makes a full catalog import finish at all — the tree
    # cache was rebuilt once per row written, so a 2901-leaf import (3444
    # categories, 14 409 feature rows) never completed; it is 185 s now.
    # >=0.8.2 rather than >=0.8.1 for a metadata reason, not a behavioural
    # one: 0.8.2 is where categories caps `stapel-attributes<0.6` instead of
    # `<1.0`, which is the same cap this composite declares one line up. Held
    # at 0.8.1 a resolver may install a categories whose own range admits
    # attributes 0.6 — the release that adds a thirteenth type and moves the
    # discriminator mapping categories emits. A
    # composite that mounts stapel-vocabularies exists to carry an imported
    # marketplace catalogue, so a deployment able to resolve back under either
    # of those is a deployment whose declaration does not hold.
    # >=0.8.3 rather than >=0.8.2, and for the mirror of 0.8.2's own reason:
    # 0.8.2 capped `stapel-attributes<0.6` to state the range it was tested
    # against, so held there this composite's attributes line above has no
    # solution. 0.8.3 does the work instead — the contract triad names
    # `GroupConfig`/`GroupDto`, translation_keys walks a composite's children
    # (they are not catalog rows, so nothing else reaches their labels), and
    # the ResolvedFeature gate covers the one config that carries FeatureDefs
    # inside it.
    # >=0.9,<0.10 as of composite 0.6.2, and the floor moves with the cap by
    # the rule this file applies everywhere else: a deployment able to resolve
    # back onto 0.8 gets stapel-search 0.7's type-ahead with no provider for
    # `categories.suggest` — the endpoint answers, warns `search.W008`, and
    # offers no categories at all. A declaration that resolves to a permanent
    # degradation is a declaration that does nothing.
    # >=0.10,<0.11 as of composite 0.7.2, paired with the stapel-search line
    # below by the same rule: 0.10.0 grades a `categories.suggest` hit four
    # ways (exact / prefix / word / substring) instead of two, and search 0.8
    # is the module that RANKS on that grade. Either half alone is a
    # no-change: a deployment that resolves back onto categories 0.9 gets a
    # ranker whose only evidence, on a board where nearly every leaf is still
    # empty, has been flattened to two values.
    # >=0.11,<0.12 as of 0.8.0: 0.11.0 is where `Feature.visibility` exists as
    # a column at all, and where `categories.features` REQUIRES it of every
    # resolved feature. Under the old range the catalogue has no field in
    # which to say that a VIN is not public, so the axis the other three
    # members enforce is one nobody can ever set.
    # >=0.11,<0.13 as of 0.8.1: categories 0.12.0 adds the two public tree
    # reads a storefront walks this composite's catalogue with — `roots`
    # (top-level categories without pulling the whole table) and
    # `by-slug/<slug>` (the storefront's own URL vocabulary resolved
    # server-side). A composite whose whole subject is a browsable classified
    # catalogue cannot cap a fleet under the release that lets the tree be
    # walked from its first rung: held at <0.12, the only way to render a row
    # of category tiles is to list every category and filter client-side —
    # measured on a live stand as a 15-page, 614 KB walk behind a cold
    # catalogue page. The floor stays at 0.11 (`Feature.visibility`).
    # <0.15, not <0.14: stapel-categories 0.14.0 adds `categories.children`,
    # the rung-by-rung tree read the fleet's listing-draft recognizer walks a
    # category guess with — the model sees one rung's siblings at a time, the
    # way a person sees the cascade, so a guess is a valid path by
    # construction. The composite itself calls nothing of it; the cap was the
    # only wall in front of the service that does.
    # <0.16, not <0.15: stapel-categories 0.15.0 makes `active` stand-owned
    # curation — a catalogue re-import writes it only on create, so it can no
    # longer resurrect a category an operator retired — and adds the
    # resurrection half of `catalog_health` (an active category under an
    # inactive parent: reachable by search or a saved link while the path to
    # it is closed). The composite calls neither; the fleet that imports a
    # 2 901-leaf catalogue into a curated stand is the whole reason both
    # exist, and the cap was the only wall in front of it.
    # <0.17, not <0.16: categories 0.16.0 splits the public catalogue from
    # the revision-SYNC feed they shared one URL for. A stand's anonymous
    # GET /categories/ was serving every acceptance-run fixture it had ever
    # created; a service or staff principal still gets the full set,
    # retirements included, so a syncing consumer converges as before. The
    # comm Functions this composite's preset wires — categories.features,
    # .path, .names, .children, .suggest — are untouched, which is why this
    # is a range move and not a floor.
    # <0.18, not <0.17: categories 0.17.0 lets a per-category feature OVERRIDE
    # carry its own display `name` (both halves of the fixture round trip
    # dropped it, so an override rendered the ROOT's label — measured on one
    # live catalogue as 566 of 760 `brand` leaves asking a question in another
    # category's words), and hardens `categories.features` / `.children` so a
    # malformed id answers the LookupError their contracts promise instead of
    # a 500. The second half reaches this composite directly: it is the module
    # that registers listings as a search source and the one whose preset
    # wires those Functions. Range move — no Function signature changes.
    # <0.19, not <0.18: stapel-categories 0.18.0 makes `fixture-wins` cover a
    # db-only EDIT as it already covered a db-only deletion, so a catalogue
    # load converges instead of stranding a retyped root for ever, and the
    # plan now reports the overrides the load will refuse instead of printing
    # a clean plan for a load that errors. Loader behaviour only; this preset
    # runs no catalogue load — the cap was the only thing in front of it.
    # <0.20, not <0.19: stapel-categories 0.19.0 gives every node a
    # `children_as` — whether its children are real subcategories (a tile grid
    # of destinations) or a partition of ONE attribute template (new/used,
    # buy/sell/rent, boys/girls) that belongs on a chip row over the parent's
    # own feed — with the derivation command that answers it for an imported
    # catalogue and `GET /categories/api/v1/tree/`, the whole visible tree
    # nested in one cached call. Additive: two columns with defaults, one key
    # on the public category payload, one endpoint. This preset reads none of
    # it — no Function signature moved and the presentation column is a
    # storefront's business — so the cap was again the only thing in front of
    # a catalogue this composite's own stand is the shape of: 7 real-estate
    # parents split Куплю/Продам/Сдам/Сниму, and ~148 more parents whose
    # children carry near-identical templates.
    # <0.21, not <0.20: stapel-categories 0.20.0 registers
    # `categories.by_slug` — root->leaf ancestry for a node named by SLUG,
    # the Function stapel-search declared for resolving `category=avtomobili`
    # and which nothing in the fleet answered until now — and gives a chips
    # parent a `children_axis_label`, the name of the axis its children split
    # on. Additive: a new Function, one new column with a blank default, one
    # new key on the public category payload; no existing signature moved.
    # This preset reads neither, and states neither: registration happens on
    # import from `stapel_categories/apps.py:ready()` and both modules are
    # mounted in this one process, so the cap is literally all that stands
    # between a stand of this shape and slug addresses that resolve instead
    # of degrading.
    "stapel-categories>=0.11,<0.21",
    # >=0.1.3 as of composite 0.8.2: the release where the QUERY_EXPANDER
    # seam exists. The preset now STATES that key, and an AppSettings that
    # has never heard of it must not be handed it — the floor names the
    # version the stated key is real in.
    # >=0.1.4: the vector.label_corpus provider this preset registers, and
    # the VECTOR_SIMILAR_FUNCTION consumer it points at search.similar.
    # <0.3, not <0.2: 0.2.0 gives a term an ordering signal (`popularity`,
    # a `popular` band, and a `vocabularies.match` that returns a real score
    # instead of dropping it). Range only for THIS module — the preset still
    # registers the same corpus provider and points the same consumer at
    # `search.similar`. Held at <0.2 the cap pinned every fleet to a
    # dictionary that can only be alphabetical and to a matcher no caller
    # can threshold, which is the fifth time in this file a sibling's cap,
    # not an incompatibility, was the wall.
    "stapel-vocabularies>=0.1.4,<0.3",
    # <0.11 with the floor at 0.10 — the same rule 0.4.1 and 0.4.2 applied to
    # this line twice (the enumeration oracle, then ALLOW_ANONYMOUS_WRITES):
    # a deployment able to resolve back onto a listings without the behaviour
    # this composite declares is a deployment whose declaration does nothing.
    # Here the behaviour is rule-state requiredness on publish and the ref
    # DAO in the title/badge projections — see the block above.
    # >=0.10.2: 0.10.1 regenerated the schema against attributes 0.6 while
    # still declaring a floor of 0.5, so its own contract test fails on the
    # range it advertises; 0.10.2 states >=0.6,<0.7, which is the range this
    # composite now declares one member up.
    # >=0.11,<0.12: 0.11.0 declares the attributes range above, and it carries
    # `listings_reproject_features` — the command that re-derives the four
    # projections from the stored draft and the CURRENT category schema. A
    # write-time snapshot has no other way to become true again, and every
    # listing published before attributes 0.7.0 is a stale one.
    # >=0.12.1,<0.13 as of 0.8.0: 0.12.0 is the release that stops handing an
    # identifier attribute's value to a reader without the entitlement — the
    # build-time drop from the three public projections and the read-time
    # redaction of `features`. 0.12.1 rather than 0.12.0 because that is where
    # the pin on stapel-attributes states the version it actually needs.
    # A fleet able to resolve back onto 0.11 publishes the VIN again, and
    # nothing errors while it does.
    # >=0.12.1,<0.14 as of 0.8.1: listings 0.13.0 makes
    # `listings_reproject_features` — the command this block already calls the
    # only way a write-time snapshot becomes true again — repair a listing
    # FIELD BY FIELD. Until it did, one attribute that no longer validated
    # skipped the whole row, so every other field on that listing kept
    # whatever an older engine left there; measured on a live stand as 12
    # listings stuck on a stale shape for reasons unrelated to the fields
    # broken on screen. Capping a fleet under it keeps the repair this
    # composite depends on half-working.
    #
    # >=0.13.3 as of composite 0.8.2: the release where MODERATION_GATE
    # exists. checks.check_moderation_gate_agreement (classified.E004) holds
    # that key and STAPEL_MODERATION's per-target gate together; against an
    # older listings the knob is a declared-but-unconsumed key the check has
    # to special-case as "pre". The floor states the version the seam is
    # actually checked against, so the special case is for a stale
    # environment, not a resolvable install.
    # <0.15, not <0.14: stapel-listings 0.14.0 claims CDN media references
    # for a listing's photos (draft and published alike), the half without
    # which stapel-cdn's orphan sweeper cannot tell a live photo from an
    # abandoned upload. Nothing here reads it; the cap was the wall.
    # <0.16, not <0.15: stapel-listings 0.15.0 moves the index-boundary
    # detector into `Listing.save()`, so a status write that skipped the
    # state machine can no longer leave a de-listed listing in a search index
    # — the seam THIS composite owns, since it is the module that registers
    # listings as a stapel-search source. It also makes `price` nullable: an
    # unstated price is NULL rather than a public "0 ₽", which the card
    # already carried correctly (`dto.ListingCard.price` is Optional and
    # `cards._base_card` passes the value through untouched), so the null
    # reaches a storefront as a null and "price not stated" is renderable
    # without a client guessing what 0 meant.
    # <0.18, not <0.16: fix pack 7's listings half, and this composite is the
    # module that has to know about it, because two of the three change what
    # PUBLISHES. 0.16 refuses a draft with no coordinates
    # (REQUIRE_LOCATION_ON_PUBLISH, on by default) and derives the published
    # `location_label` from the pin through `geo.reverse_geocode` — a
    # Function this preset already mounts the provider for (preset.py), which
    # is exactly why the coupling is this composite's to declare. 0.17 adds
    # `GET listings/engagement`, the batched per-viewer overlay a card built
    # from the SEARCH index needs: the stored card can carry neither a flag
    # that differs per reader nor a counter that moves faster than a document
    # re-indexed on a listing event, and this composite is the module that
    # registers listings as a stapel-search source.
    # <0.20, not <0.18: listings 0.18/0.19 land in one release.
    # `listings_reproject_features` can BUILD a missing projection — it
    # selected `exclude(features=[])`, keying the population on its own
    # OUTPUT, so a listing carrying a draft and no projection was never
    # examined and a live fleet had 12 published rows serving an empty
    # characteristics table. That repair emits `listing.updated` for every
    # changed row in an indexed status, which is precisely why this composite
    # cares: it is the module that registers listings as a search source, so
    # the re-projection is what makes the SERP card follow. `category_id`
    # also gained a model-field validator (an id, never a search path).
    # <0.21, not <0.20: stapel-listings 0.20.0 gives a seller a way out of
    # every status the cabinet can put a listing into. The owner API used to
    # expose two lifecycle edges, `archive` and `complete`, and both are
    # exits — so ARCHIVED, PAUSED, EXPIRED, SOLD, REJECTED and BLOCKED were
    # one-way doors and DELETE was the only call that still answered, which
    # is exactly what a live fleet's sellers reported. `OWNER_TRANSITIONS`
    # plus one `transition` route closes it, and the owner card now carries
    # `available_transitions` so a cabinet reads the moves off the server
    # that owns the state machine instead of re-deriving them.
    #
    # It also renames the never-submitted `moderation_status` default from
    # `pending` to `not_submitted` (167 drafts on that stand claimed to be
    # under review with no moderation case behind any of them). This
    # composite cares about that one directly: it is the module that
    # registers `listing` as a moderation target and builds the subject
    # cards, and `cards.py` copies `moderation_status` through verbatim — a
    # pass-through, so the new value rides it without a shape change.
    # <0.22, not <0.21: stapel-listings 0.21.0 coarsens the public listing
    # card's coordinates (~1.1km + `geo_precision_km`) so an anonymous reader
    # no longer gets the seller's address. This composite's own card builder
    # (`cards.py::_base_card`) carries no coordinates at all, and the search
    # document it feeds (`search_sources.py`) reads the MODEL, not the
    # serializer, so the index keeps the true point and `distance_km` is
    # unaffected. The change is inert here; the cap is only in the way.
    "stapel-listings>=0.13.3,<0.22",
    # <0.5, not <0.4: the picker's server half is 0.4.0 (GET /geo/api/v1/map/config
    # and geocoding/resolve). Held at <0.4 this composite pins a fleet to a geo that
    # cannot serve a map, so a listing composer has no choice but to ask a human for
    # latitude and longitude. Nothing here imports stapel_geo — the preset only mounts
    # it (preset.py:25,52) — so the range is the whole coupling.
    "stapel-geo>=0.2,<0.5",
    # >=0.6,<0.7. Three releases this composite's own source module depends on:
    # 0.4.0 makes `r.price` a real filter axis and ships facet captions for
    # inline options; 0.5.0 adds the cross-script conformance scenario; 0.6.0
    # captions the vocabulary-backed facets too, through the same
    # stapel-attributes resolver this composite already registers — which is
    # what stops a panel reading «Состояние: Б/у» directly above
    # «Производитель: apple».
    # >=0.7,<0.8 as of composite 0.6.2: 0.7.0 makes `/suggest` answer
    # CATEGORIES — each row the full ancestor path plus the live listing
    # count, ranked by that count — which is what a classified's search box
    # is for, and it is paired with the stapel-categories floor above
    # because one without the other is half a feature.
    # >=0.8.1,<0.9 as of composite 0.7.2. Two rankings, both measured on a
    # live board at full catalogue scale and both of them a case of the right
    # answer being computed and then sorted below something worse:
    #   * `/suggest` sorted an all-zero result set by NAME, so the node a
    #     buyer typed letter for letter came third behind two nodes that
    #     merely contain the word. It now sorts stocked-before-empty, then by
    #     the match grade categories 0.10 reports — the floor above.
    #   * the facet plan ranked on the author's flags alone, so on a
    #     59-feature imported leaf a mandatory integer took the last of twelve
    #     budget slots and the whole vocabulary identity chain fell past the
    #     cap. A bounded option set now outranks a measurement, always.
    # 0.8.1, not 0.8.0: 0.8.0 shipped with `__version__` still reading 0.7.0.
    # >=0.9,<0.10 as of 0.8.0: 0.9.0 is where a non-public attribute stops
    # being indexed, planned, counted or filterable. It matters independently
    # of stapel-listings 0.12: an index is an ORACLE, so `?f.vin=<value>`
    # confirming which listing a VIN belongs to is a disclosure even on a
    # deployment whose detail pages are already clean.
    # >=0.10.1,<0.11 as of composite 0.8.3: 0.10.x is the vector net (the
    # VECTOR_CORPORA registry this preset now populates, and the
    # `search.similar` Function the vocabularies typeahead is pointed at).
    # The floor is the PATCH because both prior wheels are broken the same
    # way — 0.9.1's release commit carried the suggest hook without the
    # package, 0.10.0's wheel omitted the package from its explicit
    # packages list — and on either, every suggest request with a query
    # 500s.
    # >=0.11.1,<0.12 as of composite 0.9.0: a category suggestion carries its
    # own destination (`count_scope` + `query`). Before it, the two row kinds
    # meant different things by `count` and the answer never said which, so a
    # storefront had one rule for both and it was wrong for every name row —
    # a place row's honest count followed with the typed text opens a page
    # that does not have those listings. Purely additive on the wire, and the
    # FLOOR moves rather than only the cap because the storefront contract
    # this composite documents now names those two fields.
    # <0.13, not <0.12: stapel-search 0.12.0 stops the filtered ANN answering
    # short (one HNSW index serves every corpus, so a kind-scoped search
    # silently truncated — the isolated arm lost 75% of its recall), adds the
    # nearby/all bands behind a flag, and wires the alias rung that actually
    # reaches phonetic brands. This preset declares corpora and reads none of
    # that — the cap was the only thing in front of it.
    # <0.15 as of composite 0.10.4: stapel-search 0.14.0 draws the facet plan
    # from the categories a result set actually contains. Under the old cap
    # this composite's own storefront is the deployment where the defect was
    # MEASURED — a branch category page and a text search offering zero
    # filters over listings that all carry a manufacturer — so the cap is
    # what stands between the fix and the only fleet that has the shape.
    # The span carries 0.13.0's public geo grid with it: an anonymous
    # reader's `distance_km` is measured against the same ~1.1km grid the
    # public card publishes, which is the search half of the coarsening
    # stapel-listings 0.21.0 already did on the card (composite 0.10.3).
    # This preset declares SOURCES and VECTOR_CORPORA and configures neither
    # facets nor geo precision: both new settings ship with defaults measured
    # on the reference stand, and a composite restating them would freeze a
    # number the library is entitled to re-measure.
    # <0.16, not <0.15: stapel-search 0.15.0 adds a denormalised `owner_key`
    # to a search hit. This module already writes that column on every
    # `ClassifiedListingDocument` it hands to search (`search_sources.py`
    # sets `owner_key=str(payload.get("owner_id") or "")` on indexing) — the
    # release only means search now carries the field back on the hit, which
    # nothing in this preset reads. The cap was the only wall.
    "stapel-search>=0.11.1,<0.16",
    # >=0.4, not >=0.3: 0.4.0 is where stapel_moderation subscribes
    # 'user.merged' — a merge re-parents the reports and decisions an account
    # holds, and an app that only knows 'user.deleted' strands them. Under
    # the old range a resolver picks 0.3.x and this composite's own
    # `manage.py check` raises stapel_core.lifecycle.E001; the cap moves with
    # the floor by the house pre-1.0 rule.
    # <0.6, not <0.5: 0.5.0 implements MEDIA_TRANSPORT — declared in its conf
    # and read by nothing, so every screening of a listing with a REAL photo
    # sent the provider a host-relative path and came back
    # `screening_unavailable`. It also adds the synchronous draft gate
    # (`moderation.screen_draft`) this composite's composer needs to refuse a
    # non-compliant draft in the composer instead of publishing it and
    # reviewing after. Both are additive; nothing this module calls changed
    # shape.
    # <0.7, not <0.6: stapel-moderation 0.6.0 adds `rescreen_stuck_cases`,
    # the beat job that recovers a case nothing else can move. `needs_review`
    # was terminal in practice on any deployment without a staffed queue —
    # `sweep_stale_cases` fills the human queue and nothing drained it — and
    # a live fleet had 51 cases parked there, the oldest two days old. The
    # same mechanism makes an owner's EDIT re-screen: `open_case` dedups on
    # OPEN_STATES, so editing a listing whose case was still queued changed
    # the content under a verdict about different content.
    #
    # 0.6.0 also stops a screening that resolved none of a listing's photos
    # from reporting as a full screening. This composite registers `listing`
    # with `media: True`, so it is the registration that makes that path
    # live here.
    "stapel-moderation>=0.4,<0.7",
    # >=0.6.1 is LOAD-BEARING, not hygiene: 0.6.1 is where chat began
    # refusing a blocked pair the THREAD at create_direct, and 0.4.0
    # deleted this package's own pre-creation door on that promise.
    # Against 0.6.0 the deletion re-opens the hole it covered — a blocked
    # buyer's empty thread arriving in the blocker's inbox.
    # >=0.6.3 as of 0.5.4, for the third instance of the same reason: 0.6.3 is
    # where chat consumes 'user.merged' and moves a guest's participations,
    # authored messages and assigned_operator rows onto the survivor. This
    # suite MOUNTS chat, so a floor of 0.6.1 lets a runner install a chat that
    # trips stapel_core.lifecycle.E001 — and a deployment on 0.6.1 loses a
    # signed-in visitor's whole conversation to the CASCADE.
    "stapel-chat>=0.6.3,<0.8",
]

# The block harness this module ships (stapel_classified/testing.py). A
# deployment that installs this composite inherits
# STAPEL_CHAT["BLOCK_ENFORCEMENT"]="required" from the preset and therefore
# needs a registered block provider in its OWN tests; making every consumer
# invent one is how a posture gets weakened instead of met.
[project.entry-points.pytest11]
stapel_classified = "stapel_classified.testing"

[project.urls]
Homepage = "https://github.com/usestapel/stapel-classified"
Repository = "https://github.com/usestapel/stapel-classified"
Documentation = "https://github.com/usestapel/stapel-classified#readme"
Changelog = "https://github.com/usestapel/stapel-classified/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-classified/issues"

[project.optional-dependencies]
all = []
# What the TEST SUITE needs, as opposed to what the package needs. It is a
# declaration, not a convenience: every sibling any test imports OR MOUNTS
# belongs here, and tests/test_test_dependencies.py fails if one is missing.
# 0.3.1 shipped red on CI precisely because this list did not exist — the
# suite mounts stapel_chat, whose consumers need `channels`, which no file in
# this repo asked for and no runner had. Ported from stapel-chat 0.5.1, where
# the same defect class was closed with the same mechanism.
test = [
    "pytest",
    "pytest-django",
    "pytest-cov",
    # stapel_realtime is mounted for chat's WebSocket substrate, and chat's
    # deployment checks (E010-E014) import its consumers.
    "channels",
    "daphne",
    "stapel-tools>=0.9.1,<1",
    # Mounted in conftest.py, not imported by any test file: the block
    # provider (`profiles.relationships`) BLOCK_ENFORCEMENT="required"
    # demands, and the display-name/public-card reads the header makes.
    # A harness with a fixture in its place proved only that the fixture
    # agreed with itself.
    # >=0.17.0, not >=0.16.0: 0.17.0 is where stapel_profiles subscribes
    # 'user.merged'. The suite MOUNTS it, so a floor under 0.17.0 lets a
    # runner install a profiles that fails stapel_core.lifecycle.E001 in
    # tests/test_composite.py — the same class of red the reviews and
    # moderation floors above were raised for, one extra down.
    "stapel-profiles>=0.17.0,<1.0",
    "stapel-realtime[channels]>=0.1.2,<1.0",
]

[tool.setuptools]
package-dir = {"stapel_classified" = "."}
# No `stapel_classified.migrations`: since 0.3.2 this package owns no models
# at all (see the CHANGELOG — `ConversationSubject` was deleted when
# stapel-chat 0.6.0 grew subjects of its own), so it has no migration path
# either. A composite with an empty model registry is the point, not an
# oversight.
packages = ["stapel_classified", "stapel_classified.tests"]

[tool.setuptools.package-data]
stapel_classified = ["py.typed", "docs/capabilities.json", "docs/llms.txt", "docs/flows.json", "docs/errors.json", "docs/schema.json", "docs/frontend-contract.md", "CONFIG.MD", "schemas/functions/*.json", "translations/*.json"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
django_find_project = false
addopts = "--tb=short -q --import-mode=importlib"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/migrations/*",
]
