[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-classified"
version = "0.3.3"
description = "Composite: classified ads — the shop composite + geo + search + moderation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "classified", "composite", "geo", "search", "moderation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# A composite introduces NO versions of its own — it pins the same ranges the
# STAPEL_LIBS registry / each member lib already uses, fixing the combination.
#
# stapel-categories is pinned DIRECTLY, above the floor stapel-shop asks for:
# the search source's category rollup is answered by `categories.path`, which
# arrived in 0.5.6. Depending on it only transitively would let a resolver
# pick 0.5.5 and leave every parent-category filter finding nothing.
#
# stapel-moderation's floor is raised to 0.3 by the same target: a chat
# message is the first target here whose content is PRIVATE, and 0.3.0 is the
# release where `can_view_content` is asked on behalf of the moderator
# actually looking (it passed actor_id=None before) and where the card's
# `content` is a declared field of the contract rather than a graft onto the
# response dict.
#
# stapel-chat's floor is 0.6 as of 0.3.2, and the pin is now load-bearing in a
# way it was not: this composite READS chat. `chat.conversation_participants`
# (0.6.0) is where a conversation's parties and its subject come from since
# `ConversationSubject` was deleted, and `chat.moderation_content` (0.5.0)
# serves a reported message. On chat 0.5 every conversation header answers 503
# — a resolver error is a much better place to learn that than an empty inbox.
# The composite still imports nothing from chat and mounts none of it; the pin
# fixes WHICH chat a deployment that has one must be on.
#
# stapel-listings is pinned DIRECTLY too, for the same shape of reason:
# `search_sources.listing_source()` imports `stapel_listings.models.
# INDEXED_STATUSES` by name to build `visible_statuses`, so this composite
# reads listings' re-moderation-keeps-it-visible behaviour (0.5.0) straight
# off that set. Leaving the pin transitive would let a resolver settle on
# whatever floor stapel-shop asks for and silently regress the seam this
# composite is the one place that can prove.
#
# stapel-core's floor is 0.45 as of 0.3.2 — not because anything here needs a
# 0.45 API, but because stapel-chat 0.6.0 does, and fixing a COMBINATION that
# actually installs is the whole job of a composite's pin block. A resolver
# left to reconcile core>=0.43 with chat>=0.6 finds the answer eventually; a
# reader of this file should not have to.
#
# stapel-reviews is pinned DIRECTLY as of 0.3.2, at the range stapel-shop
# already asks for: `preset.INSTALLED_APPS` mounts it and the header's seller
# rating reads `reviews.aggregate`, so a module this composite MOUNTS was
# reaching it only transitively. The sibling-declaration gate
# (tests/test_test_dependencies.py) is what noticed.
dependencies = [
    "stapel-core>=0.45,<1.0",
    "stapel-reviews>=0.2,<0.4",
    "stapel-shop>=0.2.3,<0.3",
    "stapel-categories>=0.5.6,<0.6",
    "stapel-listings>=0.5,<0.8",
    "stapel-geo>=0.2,<0.4",
    "stapel-search>=0.2.2,<0.3",
    "stapel-moderation>=0.3,<0.4",
    "stapel-chat>=0.6,<0.7",
]

# The block harness this module ships (stapel_classified/testing.py). A
# deployment that installs this composite inherits BLOCK_ENFORCEMENT="required"
# and therefore needs a registered block provider in its OWN tests; making
# every consumer invent one is how a default gets weakened instead of met.
[project.entry-points.pytest11]
stapel_classified = "stapel_classified.testing"

[project.urls]
Homepage = "https://github.com/usestapel/stapel-classified"
Repository = "https://github.com/usestapel/stapel-classified"
Documentation = "https://github.com/usestapel/stapel-classified#readme"
Changelog = "https://github.com/usestapel/stapel-classified/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-classified/issues"

[project.optional-dependencies]
all = []
# What the TEST SUITE needs, as opposed to what the package needs. It is a
# declaration, not a convenience: every sibling any test imports OR MOUNTS
# belongs here, and tests/test_test_dependencies.py fails if one is missing.
# 0.3.1 shipped red on CI precisely because this list did not exist — the
# suite mounts stapel_chat, whose consumers need `channels`, which no file in
# this repo asked for and no runner had. Ported from stapel-chat 0.5.1, where
# the same defect class was closed with the same mechanism.
test = [
    "pytest",
    "pytest-django",
    "pytest-cov",
    # stapel_realtime is mounted for chat's WebSocket substrate, and chat's
    # deployment checks (E010-E014) import its consumers.
    "channels",
    "daphne",
    "stapel-tools>=0.9.1,<1",
    # Mounted in conftest.py, not imported by any test file: the block
    # provider (`profiles.relationships`) BLOCK_ENFORCEMENT="required"
    # demands, and the display-name/public-card reads the header makes.
    # A harness with a fixture in its place proved only that the fixture
    # agreed with itself.
    "stapel-profiles>=0.16.0,<1.0",
    "stapel-realtime[channels]>=0.1.2,<1.0",
]

[tool.setuptools]
package-dir = {"stapel_classified" = "."}
# No `stapel_classified.migrations`: since 0.3.2 this package owns no models
# at all (see the CHANGELOG — `ConversationSubject` was deleted when
# stapel-chat 0.6.0 grew subjects of its own), so it has no migration path
# either. A composite with an empty model registry is the point, not an
# oversight.
packages = ["stapel_classified", "stapel_classified.tests"]

[tool.setuptools.package-data]
stapel_classified = ["py.typed", "docs/capabilities.json", "docs/llms.txt", "docs/flows.json", "docs/errors.json", "docs/schema.json", "docs/frontend-contract.md", "CONFIG.MD", "schemas/functions/*.json", "translations/*.json"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
django_find_project = false
addopts = "--tb=short -q --import-mode=importlib"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/migrations/*",
]
