[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-classified"
version = "0.5.1"
description = "Composite: classified ads — the shop composite + geo + search + moderation + vocabularies"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "classified", "composite", "geo", "search", "moderation", "vocabularies"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# A composite introduces NO versions of its own — it pins the same ranges the
# STAPEL_LIBS registry / each member lib already uses, fixing the combination.
#
# stapel-categories is pinned DIRECTLY, above the floor stapel-shop asks for:
# the search source's category rollup is answered by `categories.path`, which
# arrived in 0.5.6. Depending on it only transitively would let a resolver
# pick 0.5.5 and leave every parent-category filter finding nothing. The
# range itself moved to 0.7 in this release — see the block further down.
#
# THAT KNOWN HOLD IS CLOSED. 0.5.0 shipped saying so in as many words: shop
# 0.2.6 capped `stapel-categories<0.6`, `stapel-attributes<0.5` and
# `stapel-listings<0.10`, so `pip install stapel-classified==0.5.0` was
# ResolutionImpossible until stapel-shop shipped a cap bump, and lowering the
# ranges here to satisfy stale caps would have pinned every deployment to a
# fleet where rules, form metadata and ref-typed features do not exist. shop
# 0.2.7 answered the attributes-v2 half and 0.2.8 the categories-0.8 half, so
# the floor below moves to 0.2.8 — the same rule, one member down: a resolver
# left free to pick 0.2.6 picks a shop whose own cap contradicts this file.
#
# stapel-moderation's floor is raised to 0.3 by the same target: a chat
# message is the first target here whose content is PRIVATE, and 0.3.0 is the
# release where `can_view_content` is asked on behalf of the moderator
# actually looking (it passed actor_id=None before) and where the card's
# `content` is a declared field of the contract rather than a graft onto the
# response dict.
#
# stapel-chat's floor is 0.6 as of 0.3.2, and the pin is now load-bearing in a
# way it was not: this composite READS chat. `chat.conversation_participants`
# (0.6.0) is where a conversation's parties and its subject come from since
# `ConversationSubject` was deleted, and `chat.moderation_content` (0.5.0)
# serves a reported message. On chat 0.5 every conversation header answers 503
# — a resolver error is a much better place to learn that than an empty inbox.
# The composite still imports nothing from chat and mounts none of it; the pin
# fixes WHICH chat a deployment that has one must be on.
#
# stapel-listings is pinned DIRECTLY too, for the same shape of reason:
# `search_sources.listing_source()` imports `stapel_listings.models.
# INDEXED_STATUSES` by name to build `visible_statuses`, so this composite
# reads listings' re-moderation-keeps-it-visible behaviour (0.5.0) straight
# off that set. Leaving the pin transitive would let a resolver settle on
# whatever floor stapel-shop asks for and silently regress the seam this
# composite is the one place that can prove.
#
# stapel-core's floor is 0.45 as of 0.3.2 — not because anything here needs a
# 0.45 API, but because stapel-chat 0.6.0 does, and fixing a COMBINATION that
# actually installs is the whole job of a composite's pin block. A resolver
# left to reconcile core>=0.43 with chat>=0.6 finds the answer eventually; a
# reader of this file should not have to.
#
# stapel-reviews is pinned DIRECTLY as of 0.3.2, at the range stapel-shop
# already asks for: `preset.INSTALLED_APPS` mounts it and the header's seller
# rating reads `reviews.aggregate`, so a module this composite MOUNTS was
# reaching it only transitively. The sibling-declaration gate
# (tests/test_test_dependencies.py) is what noticed.
#
# stapel-attributes becomes a DIRECT pin in 0.5.0. It is an L1 library and
# NOT a Django app (it is deliberately absent from preset.INSTALLED_APPS),
# and until now it arrived transitively through listings and shop. It cannot
# any more: this composite now installs stapel-vocabularies, whose whole job
# is to IMPLEMENT attributes' `VocabularyResolver` protocol, and that
# protocol (`stapel_attributes.vocabularies`) together with the `ref_select`
# / `ref_hierarchical_select` types is 0.5. Left transitive, a resolver could
# settle on 0.4.x and the deployment would boot with
# `stapel_vocabularies.W001` — the terms API answering normally while every
# ref-typed feature refuses to save. >=0.5.1, not >=0.5.0: 0.5.1 is the
# release whose recorded rule corpus is what the two evaluators (Python and
# attributes-react) are held to.
#
# stapel-categories >=0.8.1 (was >=0.7 in 0.5.0): 0.7 is where the six new
# `FeatureDef` keys (`rules`, `description`, `example`, `default`, `hints`,
# `group`) are stored, served by `categories.features` and declared in
# `$defs.ResolvedFeature` — on 0.6 a category can hold no rule and no
# ref-typed feature, so the vocabularies this composite mounts would have
# nothing pointing at them. The floor moved past it twice more in 0.5.1: 0.8.0
# keys a catalog re-import on `(external_source, external_id)` instead of the
# slug, and 0.8.1 makes a full-catalog import complete at all. See the
# dependency line for both.
#
# stapel-listings >=0.10: the release where requiredness on publish is the
# RULE STATE rather than `mandatory` (a conditionally required field blocks
# publication, a rule-hidden answer is dropped instead of stored) and where
# `features_title` / `features_badges` carry the `ref_select` DAO whole — the
# `labels` half that `search_sources._title_text` reads for display. On 0.9
# the mapper's ref-typed title chips would fall back to term codes.
#
# stapel-search >=0.3.1: `get_facet_mapping('ref_select') == 'term'` /
# `'ref_hierarchical_select') == 'path'`, and `closed_options` is not built
# for any config carrying an `optionsRef` — a vocabulary is open-ended for
# the facet planner, so zero-filling it would invent counts for 14 962 phone
# models nobody asked about.
#
# stapel-vocabularies >=0.1,<0.2 — the new member. Its floor is its first
# release; the cap is the house pre-1.0 rule (minor = breaking).
dependencies = [
    "stapel-core>=0.45,<1.0",
    "stapel-attributes>=0.5.1,<0.6",
    # >=0.4, not >=0.2: 0.4.0 is where ALLOW_ANONYMOUS_WRITES exists at all.
    # A fleet that declares it under the old range gets an inert setting, so
    # the floor moves with the cap rather than leaving a deployment able to
    # resolve back onto a version where the guest wall is a comment.
    "stapel-reviews>=0.4,<0.5",
    # >=0.2.8, not >=0.2.6: 0.2.8 is the release whose own
    # `stapel-categories` cap admits 0.8. Held at 0.2.6 a resolver can pick a
    # shop that caps `stapel-categories<0.8` and the line below has no
    # solution — the same ResolutionImpossible this composite has now walked
    # into three times, one member down.
    "stapel-shop>=0.2.8,<0.3",
    # >=0.8.1,<0.9, and the floor moves with the cap for the usual reason.
    # 0.8.0 stops keying a catalog re-import on the SLUG: an imported
    # category's slug comes from the source catalogue's node path, so a
    # source-side rename moved the slug while the node id stayed, and the
    # re-import soft-deleted the row holding the listings and created a
    # duplicate beside it. Matching is `(external_source, external_id)` first
    # now. 0.8.1 is what makes a full catalog import finish at all — the tree
    # cache was rebuilt once per row written, so a 2901-leaf import (3444
    # categories, 14 409 feature rows) never completed; it is 185 s now. A
    # composite that mounts stapel-vocabularies exists to carry an imported
    # marketplace catalogue, so a deployment able to resolve back under either
    # of those is a deployment whose declaration does not hold.
    "stapel-categories>=0.8.1,<0.9",
    "stapel-vocabularies>=0.1,<0.2",
    # <0.11 with the floor at 0.10 — the same rule 0.4.1 and 0.4.2 applied to
    # this line twice (the enumeration oracle, then ALLOW_ANONYMOUS_WRITES):
    # a deployment able to resolve back onto a listings without the behaviour
    # this composite declares is a deployment whose declaration does nothing.
    # Here the behaviour is rule-state requiredness on publish and the ref
    # DAO in the title/badge projections — see the block above.
    "stapel-listings>=0.10,<0.11",
    # <0.5, not <0.4: the picker's server half is 0.4.0 (GET /geo/api/v1/map/config
    # and geocoding/resolve). Held at <0.4 this composite pins a fleet to a geo that
    # cannot serve a map, so a listing composer has no choice but to ask a human for
    # latitude and longitude. Nothing here imports stapel_geo — the preset only mounts
    # it (preset.py:25,52) — so the range is the whole coupling.
    "stapel-geo>=0.2,<0.5",
    "stapel-search>=0.3.1,<0.4",
    "stapel-moderation>=0.3,<0.4",
    # >=0.6.1 is LOAD-BEARING, not hygiene: 0.6.1 is where chat began
    # refusing a blocked pair the THREAD at create_direct, and 0.4.0
    # deleted this package's own pre-creation door on that promise.
    # Against 0.6.0 the deletion re-opens the hole it covered — a blocked
    # buyer's empty thread arriving in the blocker's inbox.
    "stapel-chat>=0.6.1,<0.8",
]

# The block harness this module ships (stapel_classified/testing.py). A
# deployment that installs this composite inherits
# STAPEL_CHAT["BLOCK_ENFORCEMENT"]="required" from the preset and therefore
# needs a registered block provider in its OWN tests; making every consumer
# invent one is how a posture gets weakened instead of met.
[project.entry-points.pytest11]
stapel_classified = "stapel_classified.testing"

[project.urls]
Homepage = "https://github.com/usestapel/stapel-classified"
Repository = "https://github.com/usestapel/stapel-classified"
Documentation = "https://github.com/usestapel/stapel-classified#readme"
Changelog = "https://github.com/usestapel/stapel-classified/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-classified/issues"

[project.optional-dependencies]
all = []
# What the TEST SUITE needs, as opposed to what the package needs. It is a
# declaration, not a convenience: every sibling any test imports OR MOUNTS
# belongs here, and tests/test_test_dependencies.py fails if one is missing.
# 0.3.1 shipped red on CI precisely because this list did not exist — the
# suite mounts stapel_chat, whose consumers need `channels`, which no file in
# this repo asked for and no runner had. Ported from stapel-chat 0.5.1, where
# the same defect class was closed with the same mechanism.
test = [
    "pytest",
    "pytest-django",
    "pytest-cov",
    # stapel_realtime is mounted for chat's WebSocket substrate, and chat's
    # deployment checks (E010-E014) import its consumers.
    "channels",
    "daphne",
    "stapel-tools>=0.9.1,<1",
    # Mounted in conftest.py, not imported by any test file: the block
    # provider (`profiles.relationships`) BLOCK_ENFORCEMENT="required"
    # demands, and the display-name/public-card reads the header makes.
    # A harness with a fixture in its place proved only that the fixture
    # agreed with itself.
    "stapel-profiles>=0.16.0,<1.0",
    "stapel-realtime[channels]>=0.1.2,<1.0",
]

[tool.setuptools]
package-dir = {"stapel_classified" = "."}
# No `stapel_classified.migrations`: since 0.3.2 this package owns no models
# at all (see the CHANGELOG — `ConversationSubject` was deleted when
# stapel-chat 0.6.0 grew subjects of its own), so it has no migration path
# either. A composite with an empty model registry is the point, not an
# oversight.
packages = ["stapel_classified", "stapel_classified.tests"]

[tool.setuptools.package-data]
stapel_classified = ["py.typed", "docs/capabilities.json", "docs/llms.txt", "docs/flows.json", "docs/errors.json", "docs/schema.json", "docs/frontend-contract.md", "CONFIG.MD", "schemas/functions/*.json", "translations/*.json"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
django_find_project = false
addopts = "--tb=short -q --import-mode=importlib"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/migrations/*",
]
